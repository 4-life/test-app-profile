name: Deploy Production

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          target: runner
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          target: migrator
          tags: ghcr.io/${{ github.repository }}:migrate

      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=production
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}?schema=public
          EOF

      - name: Copy compose and env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ".env,docker/production/compose.yaml"
          target: "/tmp/deploy"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Pulling images..."
            sudo docker pull ghcr.io/${{ github.repository }}:latest
            sudo docker pull ghcr.io/${{ github.repository }}:migrate
            sudo docker tag ghcr.io/${{ github.repository }}:latest nestjs-test-app

            echo "Starting database..."
            sudo docker compose -f /tmp/deploy/docker/production/compose.yaml up -d db --wait

            echo "Running migrations..."
            sudo docker run --rm --network nestjs_test_network_prod --env-file /tmp/deploy/.env ghcr.io/${{ github.repository }}:migrate

            echo "Starting application..."
            sudo docker compose -f /tmp/deploy/docker/production/compose.yaml up -d

            echo "Cleaning up..."
            sudo docker image prune -af
            rm -rf /tmp/deploy
