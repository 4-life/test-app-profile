name: nestjs-test-app-development

services:
  app:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile
    image: nestjs-test-app-development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: "../../.env"
    volumes:
      - ../..:/app # mount local source code into container
    networks:
      - nestjs_test_network
    command: >
      sh -c "export DATABASE_URL=\"postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@db:5432/$$POSTGRES_DB?schema=public\" &&
      npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  db:
    image: postgres:latest
    env_file: "../../.env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nestjs_test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  nestjs_test_network:
    name: nestjs_test_network_dev
    driver: bridge
