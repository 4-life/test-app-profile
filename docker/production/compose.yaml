name: nestjs-test-app-production

services:
  app:
    image: nestjs-test-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file: "../../.env"
    networks:
      - nestjs_test_network

  db:
    image: postgres:latest
    env_file: "../../.env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nestjs_test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  nestjs_test_network:
    name: nestjs_test_network_prod
    driver: bridge
